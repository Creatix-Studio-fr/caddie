<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Caddie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concept : parcours guidé plein écran, une question à la fois, très gros chiffres et gros boutons.
   Progression segmentée en haut, Retour / Continuer en bas, transitions latérales entre écrans. */
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#0D1F16; --muted:#5A6D62; --line:#DCE6DF;
  --brand:#0A7B54; --brand-2:#4CC79A; --brand-ink:#FFFFFF; --soft:#E0F1E8; --glow:rgba(40,190,130,.20);
  --accent:#E8512B; --accent-ink:#B2330F; --accent-soft:#FDE7E0;
  --k-viande-bg:#FCE9DC; --k-viande-ink:#8B3B12;
  --k-poisson-bg:#DFEEFA; --k-poisson-ink:#14507A;
  --k-vege-bg:#E1F0E8; --k-vege-ink:#0B6347;
  --shadow:0 1px 2px rgba(13,31,22,.05),0 12px 32px rgba(13,31,22,.06);
  --f-head:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1310; --surface:#12201A; --ink:#E7F1EB; --muted:#92A89D; --line:#22352E;
  --brand:#3DCB98; --brand-2:#8CEBC4; --brand-ink:#052018; --soft:#153027; --glow:rgba(61,203,152,.13);
  --accent:#FF8561; --accent-ink:#FF9A7C; --accent-soft:#3A1E17;
  --k-viande-bg:#3A2417; --k-viande-ink:#FFB48A;
  --k-poisson-bg:#14293A; --k-poisson-ink:#8CC8F2;
  --k-vege-bg:#153027; --k-vege-ink:#7FE0B8;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1310; --surface:#12201A; --ink:#E7F1EB; --muted:#92A89D; --line:#22352E;
  --brand:#3DCB98; --brand-2:#8CEBC4; --brand-ink:#052018; --soft:#153027; --glow:rgba(61,203,152,.13);
  --accent:#FF8561; --accent-ink:#FF9A7C; --accent-soft:#3A1E17;
  --k-viande-bg:#3A2417; --k-viande-ink:#FFB48A;
  --k-poisson-bg:#14293A; --k-poisson-ink:#8CC8F2;
  --k-vege-bg:#153027; --k-vege-ink:#7FE0B8;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);font-variant-numeric:tabular-nums;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vmax 40vmax at 85% -10%,var(--glow),transparent 70%),radial-gradient(50vmax 40vmax at -10% 110%,var(--glow),transparent 70%)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.q:focus{outline:none}
.muted{color:var(--muted)}
.bad{color:var(--accent-ink);font-weight:600}

/* barre du haut */
.top{display:flex;align-items:center;gap:14px;max-width:720px;margin:0 auto clamp(20px,5vh,44px)}
.back{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .15s,border-color .2s}
.back:hover{border-color:var(--brand)} .back:active{transform:scale(.9)}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:8px;border-radius:99px;background:var(--line);transition:background .45s}
.seg i.on{background:var(--brand)}
.cnt{font-weight:600;color:var(--muted);font-size:14px;min-width:34px;text-align:right}

/* écrans et transitions */
.screen{min-height:60vh}
.screen.enter-fwd{animation:enterFwd .4s cubic-bezier(.2,.8,.2,1) both}
.screen.enter-back{animation:enterBack .4s cubic-bezier(.2,.8,.2,1) both}
.screen.leave-fwd{animation:leaveFwd .18s ease-in forwards}
.screen.leave-back{animation:leaveBack .18s ease-in forwards}
.screen.still *{animation:none!important}
.screen.still .fresh{animation:rise .5s cubic-bezier(.2,.8,.2,1) both!important}
.step{max-width:720px;margin:0 auto;display:flex;flex-direction:column;min-height:62vh}
.step.mid{max-width:820px} .step.wide{max-width:1040px}
.q{font-size:clamp(32px,6.4vw,56px);line-height:1.06;font-weight:700;margin-bottom:12px}
.sub{font-size:19px;color:var(--muted);margin-bottom:34px;max-width:46ch}
.body{margin-bottom:28px}
.bar{margin-top:auto;position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;padding-block:18px 6px;background:linear-gradient(to top,var(--bg) 72%,transparent)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 26px;height:56px;font-weight:600;font-size:17px;text-decoration:none;transition:transform .15s,box-shadow .25s,background .2s,border-color .2s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.96)}
.btn.big{height:64px;padding:0 34px;font-size:19px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 10px 26px -10px var(--brand)}
.btn.primary:hover{box-shadow:0 14px 30px -10px var(--brand);transform:translateY(-2px)}
.btn.primary:active{transform:scale(.96)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn svg{transition:transform .25s}
.btn.primary:hover svg{transform:translateX(4px)}
.tag{font-size:12px;font-weight:600;background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px}

/* compteurs */
.counter{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,44px);margin:6px 0 26px}
.round{width:78px;height:78px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:38px;line-height:1;display:grid;place-items:center;flex:none;transition:transform .15s,border-color .2s,opacity .2s}
.round:hover{border-color:var(--brand)} .round:active{transform:scale(.88)} .round:disabled{opacity:.3;cursor:not-allowed}
.bignum{font:700 clamp(96px,28vw,176px)/1 var(--f-head);min-width:2ch;text-align:center;letter-spacing:-.05em}
.bump{animation:bump .4s cubic-bezier(.3,1.5,.5,1)}
.dots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--brand)}
.dots i.new{animation:pop .45s}
.center{justify-content:center}

/* puces */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:0 24px;height:56px;font-weight:500;font-size:18px;transition:transform .15s,background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--brand)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.pop,.tile.pop{animation:pop .4s}

/* groupes de puces */
.grp{margin-bottom:28px} .grp .lab{margin-bottom:12px}
.chip small{margin-left:10px;font-size:13px;font-weight:600;opacity:.55}
.chip[aria-pressed="true"] small{opacity:.85}
.meta .tag{margin-left:auto;margin-right:8px}

/* budget */
.moneybig{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:4px 0 22px}
.moneybig input{width:calc(var(--len,2)*.62em + .3em);min-width:1.4em;max-width:100%;border:0;border-bottom:4px solid var(--line);background:none;color:var(--ink);font:700 clamp(72px,22vw,132px)/1.1 var(--f-head);letter-spacing:-.04em;text-align:center;outline:0;padding:0;border-radius:0;transition:border-color .2s}
.moneybig input:focus{border-color:var(--brand)}
.moneybig span{font:700 clamp(40px,10vw,64px) var(--f-head);color:var(--muted)}
.perbox{margin-top:34px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 24px;box-shadow:var(--shadow)}
.perline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.perline b{font:700 40px var(--f-head);letter-spacing:-.02em}
.gauge{position:relative;height:14px;border-radius:99px;background:linear-gradient(to right,var(--accent) 0 30%,var(--brand) 30% 70%,var(--brand-2) 70% 100%)}
.gauge .dot{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:var(--surface);border:5px solid var(--ink);transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.gl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.gl span:nth-child(1){width:30%} .gl span:nth-child(2){width:40%;text-align:center} .gl span:nth-child(3){width:30%;text-align:right}
.hint{color:var(--muted)}

/* magasins */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{position:relative;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:20px 18px;min-height:98px;display:grid;gap:2px;align-content:center;transition:transform .15s,border-color .2s,background .2s}
.tile b{font:700 20px var(--f-head)} .tile small{color:var(--muted);font-size:14px}
.tile:hover{border-color:var(--brand)} .tile:active{transform:scale(.96)}
.tile[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
.tile .ck{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.tile[aria-pressed="true"] .ck{transform:scale(1)}

.compat{margin-top:26px;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;color:var(--muted)}
.compat b{font:700 44px var(--f-head);color:var(--ink)}

/* récapitulatif */
.recap{display:grid;gap:12px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.rrow div{min-width:0} .rrow small{display:block;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rrow b{font:600 19px var(--f-body);overflow-wrap:anywhere}
.edit{border:2px solid var(--line);background:none;border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;flex:none;transition:border-color .2s,transform .15s}
.edit:hover{border-color:var(--brand)} .edit:active{transform:scale(.94)}

/* chargement */
.loading{align-items:center;text-align:center;justify-content:center;gap:26px}
.loading .q{margin:0}
.cartbig{width:132px;height:132px;color:var(--brand);animation:roll 1.3s ease-in-out infinite}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:16px;text-align:left}
.ticks li{display:flex;align-items:center;gap:14px;font-size:19px;opacity:.3;animation:tick .4s forwards;animation-delay:var(--d)}
.box{position:relative;width:32px;height:32px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .25s,border-color .25s}
.box svg{width:20px;height:20px;fill:none;stroke:var(--brand-ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.box path{stroke-dasharray:1;stroke-dashoffset:1}
.ticks .box{background:var(--brand);border-color:var(--brand)}
.ticks .box path{animation:draw .35s forwards;animation-delay:calc(var(--d) + .1s)}

/* menu */
.bcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px 28px;margin-bottom:24px;box-shadow:var(--shadow)}
.lab{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.total{font:700 clamp(44px,9vw,64px)/1.05 var(--f-head);letter-spacing:-.03em}
.meter{height:16px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:8px}
.meter>span{display:block;height:100%;background:var(--brand);border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter.over>span{background:var(--accent)}
.bper b{font:700 28px var(--f-head)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:22px}
.cards.stagger>.rcard{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .25s,box-shadow .25s,border-color .25s}
.rcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.rcard.out{animation:out .22s ease-in forwards!important}
.rcard h3{font-size:22px;line-height:1.2}
.rcard.small h3{font-size:19px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kind{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px}
.k-viande{background:var(--k-viande-bg);color:var(--k-viande-ink)}
.k-poisson{background:var(--k-poisson-bg);color:var(--k-poisson-ink)}
.k-vegetarien{background:var(--k-vege-bg);color:var(--k-vege-ink)}
.ings{font-size:15px;color:var(--muted)}
.foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cost{font:700 24px var(--f-head)} .cost small{font:400 13.5px var(--f-body);color:var(--muted)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;transition:transform .15s,border-color .2s,background .2s}
.chipbtn:hover{border-color:var(--brand)} .chipbtn:active{transform:scale(.93)}
.chipbtn.solid{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.addbtn{margin-bottom:16px}
.addbtn .pl{display:inline-block;transition:transform .35s}
.addbtn[aria-expanded="true"] .pl{transform:rotate(45deg)}
.drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.drawer.open{grid-template-rows:1fr}
.drawer>.inner{overflow:hidden;min-height:0}

/* courses */
.aisle{margin-bottom:26px}
.aisle h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:22px;padding:0 4px 10px}
.aisle h2 span{font:500 16px var(--f-body);color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:0 20px;box-shadow:var(--shadow)}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding-block:16px;border-top:1px solid var(--line);cursor:pointer;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*35ms)}
.row:first-child{border-top:0}
.row input{position:absolute;opacity:0;width:32px;height:32px;left:0;margin:0}
.row input:focus-visible+.box{outline:3px solid var(--brand);outline-offset:3px}
.row input:checked+.box{background:var(--brand);border-color:var(--brand);animation:pop .4s}
.row input:checked+.box path{stroke-dashoffset:0;transition:stroke-dashoffset .3s .05s}
.nm{display:grid;min-width:0}
.nm b{font-size:18px;font-weight:600;width:max-content;max-width:100%;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 2px;transition:background-size .35s,color .3s}
.nm small{color:var(--muted);font-size:14px}
.rt{display:grid;text-align:right;transition:opacity .3s}
.rt b{font-weight:600} .rt small{color:var(--muted)}
.row.done .nm b{background-size:100% 2px;color:var(--muted)}
.row.done .rt{opacity:.45}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--brand-2);animation:burst .55s ease-out forwards}
.done-msg{display:flex;align-items:center;gap:12px;background:var(--soft);color:var(--brand);font-weight:600;border-radius:20px;padding:16px 20px;margin-bottom:22px;animation:rise .5s both}
.fine{font-size:14px;color:var(--muted);margin-top:8px}
.copybox{width:100%;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:14px/1.4 var(--f-body);padding:12px;margin-top:8px}

/* accueil */
.intro{max-width:760px;justify-content:flex-start;padding-top:2vh}
.logo{display:flex;align-items:center;gap:10px;font:700 28px var(--f-head);color:var(--brand);letter-spacing:-.03em;margin-bottom:clamp(28px,8vh,64px)}
.intro .q{font-size:clamp(40px,9vw,80px);line-height:1;max-width:14ch;margin-bottom:20px}
.intro .bar{position:static;background:none;padding-block:6px 40px}
.floaters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.floaters li{display:grid;gap:6px;justify-items:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);animation:rise .6s cubic-bezier(.2,.8,.2,1) both,float 5s ease-in-out infinite;animation-delay:calc(var(--i)*120ms + .3s),calc(var(--i)*-1.4s)}
.floaters b{font:700 19px var(--f-head);line-height:1.2}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}

@keyframes enterFwd{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
@keyframes leaveFwd{to{opacity:0;transform:translateX(-40px)}}
@keyframes leaveBack{to{opacity:0;transform:translateX(40px)}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.9)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:translateY(16px) scale(.9);opacity:.2}60%{transform:translateY(-5px) scale(1.04);opacity:1}100%{transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes burst{to{transform:rotate(var(--a)) translateY(-30px) scale(.3);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes roll{0%,100%{transform:translateX(-30px) rotate(-3deg)}50%{transform:translateX(30px) rotate(3deg)}}
@keyframes tick{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ticks li{opacity:1} .ticks .box path{stroke-dashoffset:0}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .bcard{grid-template-columns:1fr}
  .bar .btn{flex:1 1 100%}
  .bar .btn.big{width:100%}
  .round{width:68px;height:68px}
  .rows{padding:0 14px}
}
</style>

</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">
  <header class="top" id="top" hidden></header>
  <main id="screen" class="screen"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC*/
/* ---------- Données ----------
   Prix estimés (tarif de référence E.Leclerc, 2026), par paquet.
   IA plus tard : getMenus() (plus bas) appellera un serveur qui renvoie des recettes au format de REC.
   Le prix reste toujours calculé ici à partir de ING, jamais par l'IA.
   Format ING : [nom, rayon, unité, taille du paquet, prix du paquet, nom de l'unité si "pc"] */
const RAW={
  pates:['Pâtes','epicerie','g',500,0.95], riz:['Riz long','epicerie','g',1000,2.20],
  pdt:['Pommes de terre','legumes','g',2500,3.80], lentilles:['Lentilles vertes','epicerie','g',500,1.90],

}

const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const E=n=>eur.format(n);
function fmtQty(n,ing){
  if(ing.unit==='g') return n>=1000?nf.format(n/1000)+' kg':nf.format(Math.round(n))+' g';
  if(ing.unit==='ml') return n>=1000?nf.format(n/1000)+' L':nf.format(Math.round(n))+' ml';
  const v=Math.round(n*10)/10; return nf.format(v)+' '+(v>1?ing.noun+'s':ing.noun);
}

/* ---------- Calculs ---------- */
const store=()=>STORES.find(s=>s.id===S.prefs.store)||STORES[0];
const baseCost=r=>r.ing.reduce((a,[g,q])=>a+q/g.pack*g.price,0);
const tagsOf=r=>new Set([r.d,r.b,...r.g,...(r.t<=25?['rapide']:[]),...(baseCost(r)<=1.6?['eco']:[])]);
function excluded(r){
  return S.prefs.avoid.some(a=>AVOID_TEST[a]&&AVOID_TEST[a](r));
}
function score(r){
  if(!S.prefs.tastes.length) return 1;
  const t=tagsOf(r); return 1+S.prefs.tastes.filter(x=>t.has(x)).length*2;
}
/* coût au prorata par personne */
function cost(r){return r.ing.reduce((a,[g,q])=>a+q/g.pack*g.price*store().k,0)}
/* panier réel : paquets entiers à acheter */
function basket(ids,people){
  const need={},from={};
  ids.forEach(id=>{const r=REC_BY[id]; if(!r) return;
    r.ing.forEach(([g,q])=>{need[g.id]=(need[g.id]||0)+q*people; (from[g.id]=from[g.id]||[]); if(!from[g.id].includes(r.n)) from[g.id].push(r.n);});});
  const order=RAYONS.map(x=>x[0]);
  const lines=Object.keys(need).map(id=>{
    const g=ING[id], n=need[id];
    const packs=Math.max(1,Math.ceil(n/g.pack-1e-6));
    const c=Math.round(packs*g.price*store().k*100)/100;
    return {ing:g,need:n,packs,cost:c,left:packs*g.pack-n,recipes:from[id]};
  }).sort((a,b)=>order.indexOf(a.ing.rayon)-order.indexOf(b.ing.rayon)||a.ing.name.localeCompare(b.ing.name,'fr'));
  return {lines,total:Math.round(lines.reduce((a,l)=>a+l.cost,0)*100)/100,count:lines.length};
}
function sample(cand,n){
  const pool=cand.map(r=>({r,w:score(r)})), out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,x)=>a+x.w,0); let x=Math.random()*tot,i=0;
    for(;i<pool.length-1;i++){x-=pool[i].w; if(x<=0)break;}
    out.push(pool.splice(i,1)[0].r);
  }
  return out;
}
function generate(){
  const p=S.prefs, cand=REC.filter(r=>!excluded(r)), n=Math.min(p.meals,cand.length);
  S.sig=sigNow(); S.checked={};
  if(!n){S.sel=[];save();return;}
  let best=null;
  for(let t=0;t<500;t++){
    const pick=sample(cand,n);
    const b=basket(pick.map(r=>r.id),p.people);
    const over=Math.max(0,b.total-p.budget);
    const taste=pick.reduce((a,r)=>a+score(r),0);
    const cnt={}; pick.forEach(r=>{cnt[r.b]=(cnt[r.b]||0)+1});
    const maxB=Math.max(2,Math.ceil(n/3)); let pen=0;
    Object.keys(cnt).forEach(k=>{if(k!=='autre'&&cnt[k]>maxB) pen+=(cnt[k]-maxB)*5});
    const obj=over*4+b.total*0.15-taste*0.8+pen;
    if(!best||obj<best.obj) best={obj,ids:pick.map(r=>r.id)};
  }
  S.sel=best.ids; save();
}
/* remplace une recette par une autre au hasard, renvoie l'identifiant de la nouvelle */
function swap(id){
  const cand=REC.filter(r=>!excluded(r)&&!S.sel.includes(r.id));
  if(!cand.length) return null;
  const r=sample(cand,1)[0], i=S.sel.indexOf(id);
  if(i>-1){S.sel[i]=r.id; save(); return r.id;}
  return null;
}

/* ---------- Animations utilitaires ---------- */
function countUp(el,to,from,fmt=E,dur=650){
  if(!el) return;
  if(from===undefined) from=el._v===undefined?to:el._v;
  el._v=to; cancelAnimationFrame(el._raf);
  if(reduced||from===to){el.textContent=fmt(to);return;}
  const t0=performance.now();
  const tick=t=>{const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(from+(to-from)*e); if(k<1) el._raf=requestAnimationFrame(tick); else el.textContent=fmt(to);};
  el._raf=requestAnimationFrame(tick);
}
function restart(el,cls){if(!el||reduced) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls)}
function bump(el,text){el.textContent=text; restart(el,'bump')}
function burst(box){
  if(reduced||!box) return;
  const w=document.createElement('span'); w.className='burst';
  for(let i=0;i<8;i++){const d=document.createElement('i'); d.style.setProperty('--a',(i*45)+'deg'); w.appendChild(d);}
  box.appendChild(w); setTimeout(()=>w.remove(),650);
}
let toastT;
function flash(msg){const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- Barre du haut ---------- */
$('#top').innerHTML=`<button class="back" data-act="back" aria-label="Retour">${ICON.back}</button><div class="seg" role="progressbar" aria-label="Progression" aria-valuemin="1" aria-valuemax="${SEQ.length}">${SEQ.map(()=>'<i></i>').join('')}</div><span class="cnt" id="cnt"></span>`;
function updateTop(){
  const s=S.step, top=$('#top'); top.hidden=(s==='intro'); if(s==='intro') return;
  const i=SEQ.indexOf(s==='loading'?'recap':s);
  top.querySelectorAll('.seg i').forEach((el,k)=>el.classList.toggle('on',k<=i));
  $('#cnt').textContent=(i+1)+'/'+SEQ.length;
  top.querySelector('.seg').setAttribute('aria-valuenow',String(i+1));
  top.querySelector('.back').style.visibility=s==='loading'?'hidden':'visible';
}

/* ---------- Navigation ---------- */
function afterRender(){
  updateTop();
  const s=S.step;
  if(s==='menu'||s==='courses'){
    const p=S.prefs, b=basket(S.sel,p.people), pct=Math.min(100,p.budget?b.total/p.budget*100:100);
    countUp($('#total'),b.total,shown); shown=b.total;
    const bar=$('#mbar'); if(bar) requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=pct+'%'}));
    shownPct=pct;
  }
  fresh=null;
  if(s==='loading') runLoading();
  const h=$('.q'); if(h){h.tabIndex=-1; h.focus({preventScroll:true});}
}
function renderScreen(dir){
  const root=$('#screen');
  root.className='screen '+(reduced?'':'enter-'+(dir>0?'fwd':'back'));
  root.innerHTML=VIEWS[S.step]();
  window.scrollTo(0,0);
  afterRender();
}
function refresh(){const root=$('#screen'); root.className='screen still'; root.innerHTML=VIEWS[S.step](); afterRender();}
function go(to,dir=1){
  if(busy) return; busy=true; S.step=to; save();
  const root=$('#screen'), done=()=>{renderScreen(dir); busy=false;};
  if(reduced||!root.firstElementChild){done();return;}
  root.className='screen '+(dir>0?'leave-fwd':'leave-back');
  setTimeout(done,190);
}
function next(){
  const s=S.step;
  if(editing&&EDITABLE.includes(s)){editing=false; return go('recap',1);}
  if(s==='recap') return begin();
  go(NEXT[s],1);
}
function back(){
  const s=S.step;
  if(editing&&EDITABLE.includes(s)){editing=false; return go('recap',-1);}
  if(PREV[s]) go(PREV[s],-1);
}
function begin(){
  if(S.sig===sigNow()&&S.sel.length) return go('menu',1);
  go('loading',1);
}
/* IA : mettre l'adresse du serveur ici une fois déployé (voir le guide). Vide = recettes locales uniquement.
   Le serveur renvoie des recettes au format de REC ; registerRecipe() les revérifie, le prix reste calculé ici. */
const AI_ENDPOINT='/api/menus';
async function getMenus(){
  if(AI_ENDPOINT){
    try{
      const ctrl=new AbortController(), to=setTimeout(()=>ctrl.abort(),52000);
      const res=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefs:S.prefs}),signal:ctrl.signal});
      clearTimeout(to);
      if(!res.ok) throw new Error('http '+res.status);
      const data=await res.json(), ids=[], kept=[];
      (data.recipes||[]).forEach(o=>{const id=registerRecipe(o); if(id&&!excluded(REC_BY[id])&&!ids.includes(id)){ids.push(id); if(REC_BY[id].ai) kept.push(o);}});
      if(ids.length){
        const picked=ids.slice(0,S.prefs.meals);
        const rest=sample(REC.filter(r=>!excluded(r)&&!picked.includes(r.id)),Math.max(0,S.prefs.meals-picked.length)).map(r=>r.id);
        S.sel=[...picked,...rest]; S.extra=[...(S.extra||[]).filter(x=>!kept.some(k=>k.id===x.id)),...kept].slice(-40);
        S.sig=sigNow(); S.checked={}; save(); return;
      }
    }catch(e){console.warn('Caddie : génération IA indisponible, utilisation des recettes locales.',e&&e.message?e.message:e);}
  }
  generate();
}
async function runLoading(){
  const t0=performance.now();
  try{await getMenus();}catch(e){generate();}
  const wait=reduced?300:Math.max(0,2500-(performance.now()-t0));
  setTimeout(()=>{if(S.step==='loading') go('menu',1)},wait);
}

/* ---------- Interactions sur place ---------- */
function setCount(key,v,up){
  const p=S.prefs, max=key==='people'?12:14; p[key]=v; save();
  bump($('#bignum'),String(v));
  if(key==='people'){const d=$('#dots'); if(d) d.innerHTML=dots(v,up?v-1:-1);}
  document.querySelectorAll('.round').forEach(b=>{b.disabled=b.dataset.act==='dec'?v<=1:v>=max});
  document.querySelectorAll('[data-act="setmeals"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.val===v)));
}
function updateBudgetUI(){
  const p=S.prefs, per=perMeal(), t=toneOf(per);
  countUp($('#per'),per);
  $('#dot').style.left=Math.min(97,Math.max(3,per/5*100))+'%';
  $('#tone').innerHTML=`<b>${t.t}.</b> ${t.h}`;
  const nb=$('[data-act="next"]'); if(nb) nb.disabled=p.budget<=0;
  document.querySelectorAll('[data-act="budget"]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.val===p.budget)));
}
function updateTasteUI(){
  const a=S.prefs.tastes;
  countUp($('#tastecount'),tasteMatches(),undefined,x=>String(Math.round(x)));
  const l=$('#tastelabel'); if(l) l.textContent=tasteLabel();
  const nb=$('#nextlabel'); if(nb) nb.firstChild.textContent=a.length?'Continuer':'Passer';
}
function updateAvoidUI(){
  const n=compatCount(), p=S.prefs;
  countUp($('#compat'),n,undefined,x=>String(Math.round(x)));
  const w=$('#compatwarn'); if(w) w.hidden=!(n<p.meals&&n>0);
  const nb=$('#nextlabel'); if(nb){nb.disabled=n===0; nb.firstChild.textContent=p.avoid.length?'Continuer':'Rien à éviter';}
}
function leaveCard(id,cb){
  const c=document.querySelector('.rcard[data-id="'+id+'"]');
  if(c&&!reduced){c.classList.add('out'); setTimeout(cb,230);} else cb();
}
function updateChecked(){
  const c=$('#chk'); if(!c) return;
  const total=+c.dataset.total, done=Object.keys(S.checked).filter(id=>document.querySelector('input[data-id="'+id+'"]')).length;
  c.textContent=done+' / '+total;
  const m=$('#donemsg'); if(m){const all=done===total; if(all&&m.hidden) restart(m,'done-msg'); m.hidden=!all;}
}
function listText(){
  const p=S.prefs, b=basket(S.sel,p.people);
  const head=`Liste de courses Caddie · ${store().n} · ${p.people} pers. · ${S.sel.length} repas\n`;
  const body=RAYONS.map(([k,label])=>({label,lines:b.lines.filter(l=>l.ing.rayon===k)})).filter(g=>g.lines.length)
    .map(g=>g.label+'\n'+g.lines.map(l=>`- ${l.ing.name} : ${buyText(l)} (${E(l.cost)})`).join('\n')).join('\n\n');
  return head+'\n'+body+`\n\nTotal estimé : ${E(b.total)}`;
}
async function copyList(){
  const text=listText();
  try{await navigator.clipboard.writeText(text); fallbackText=''; flash('Liste copiée');}
  catch(e){fallbackText=text; refresh(); const box=$('#copybox'); if(box){box.focus(); box.select(); box.scrollIntoView({block:'center'});} flash('Sélectionne le texte pour le copier');}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const {act,key,val,id}=el.dataset, p=S.prefs;
  switch(act){
    case 'next': return next();
    case 'back': return back();
    case 'inc': case 'dec': {const max=key==='people'?12:14; const v=Math.min(max,Math.max(1,p[key]+(act==='inc'?1:-1))); if(v!==p[key]) setCount(key,v,act==='inc'); return;}
    case 'setmeals': return setCount('meals',+val,+val>p.meals);
    case 'budget': {p.budget=+val; save(); const i=$('#budget'); i.value=val; i.style.setProperty('--len',String(val).length); updateBudgetUI(); return;}
    case 'store': {p.store=val; save(); document.querySelectorAll('[data-act="store"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el))); restart(el,'pop'); return;}
    case 'toggle': {const a=p[key], i=a.indexOf(val); if(i>-1) a.splice(i,1); else a.push(val); save();
      el.setAttribute('aria-pressed',String(i===-1)); restart(el,'pop');
      if(key==='avoid') updateAvoidUI(); else updateTasteUI();
      return;}
    case 'edit': editing=true; return go(val,-1);
    case 'fix': editing=true; return go('avoid',-1);
    case 'remove': return leaveCard(id,()=>{S.sel=S.sel.filter(x=>x!==id); save(); refresh();});
    case 'swap': return leaveCard(id,()=>{fresh=swap(id); refresh();});
    case 'add': S.sel.push(id); save(); fresh=id; refresh(); return;
    case 'more': {drawerOpen=!drawerOpen; const d=$('#drawer'); d.classList.toggle('open',drawerOpen); d.inert=!drawerOpen;
      el.setAttribute('aria-expanded',String(drawerOpen)); $('#morelabel').textContent=drawerOpen?'Masquer les autres recettes':'Ajouter une recette'; return;}
    case 'check': {if(el.checked) S.checked[id]=true; else delete S.checked[id]; save();
      const row=el.closest('.row'); row.classList.toggle('done',el.checked); if(el.checked) burst(row.querySelector('.box')); updateChecked(); return;}
    case 'regen': S.sig=''; return go('loading',1);
    case 'copy': return copyList();
    case 'restart': editing=false; return go('people',-1);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='budget'){
    S.prefs.budget=Math.max(0,parseFloat(e.target.value)||0); save();
    e.target.style.setProperty('--len',String(e.target.value||'0').length||1);
    updateBudgetUI();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.target.closest('button,a,textarea,select,label')){
    const n=$('[data-act="next"]'); if(n&&!n.disabled){e.preventDefault(); n.click();}
  }
});

/* ---------- Démarrage ---------- */
if(!VIEWS[S.step]||S.step==='loading') S.step=(S.sel.length&&S.sig)?'recap':'intro';
if(S.step==='menu'||S.step==='courses'){ if(!S.sel.length) S.step='recap'; }
renderScreen(1);
</script>
</body>
</html>
